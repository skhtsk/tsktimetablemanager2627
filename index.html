            </div>
        </div>
    </div>

    <!-- Tab 1: Find Common Free Lessons -->
    <div id="tab-1" class="flex flex-col lg:flex-row gap-6">
        <div class="w-full lg:w-1/4 bg-gray-50 px-4 pb-4 rounded-lg border h-[300px] lg:h-[650px] overflow-y-auto scroller shadow-inner relative">
            <div class="pt-4 pb-2 mb-3 border-b sticky top-0 bg-gray-50 z-10 flex justify-between items-center">
                <h3 class="font-bold text-gray-700">Select Teachers</h3>
                <button onclick="clearAllTeachers()" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-1 px-2 rounded transition">Clear All</button>
            </div>
            <div id="t1-teacher-list" class="space-y-1"></div>
        </div>

        <div class="w-full lg:w-3/4">
            <div class="overflow-x-auto w-full bg-white shadow-sm rounded-lg border scroller">
                <table class="w-full text-sm border-collapse bg-white min-w-[600px] table-fixed">
                    <thead class="bg-gray-200 text-gray-700">
                        <tr>

                            <th class="cell w-[14.28%]">Day 2</th>
                            <th class="cell w-[14.28%]">Day 3</th>
                            <th class="cell w-[14.28%]">Day 4</th>

                        </tr>
                    </thead>
                    <tbody id="t1-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Tab 2: Swap Lesson -->
    <div id="tab-2" class="hidden">
        <div class="mb-6 flex flex-col sm:flex-row items-start sm:items-center gap-4 bg-gray-50 p-4 rounded-lg border shadow-inner text-gray-700">
            <label class="font-bold text-lg shrink-0">Who are you?</label>
            <select id="t2-me-select" class="border p-2.5 rounded shadow-sm w-full sm:flex-1 bg-white focus:ring focus:ring-blue-200 focus:outline-none" onchange="onMeSelected()">
                <!-- Options injected dynamically -->
            </select>
        </div>

        <!-- Current Teacher's Table -->
        <div id="t2-me-table-container" class="mb-8 w-full"></div>

        <!-- Candidates Panel -->
        <div id="t2-candidates-panel" class="hidden mb-8 bg-blue-50 p-5 rounded-lg border border-blue-200 shadow-sm">
            <h3 class="font-bold text-xl mb-4 text-blue-900">Candidates for Swapping</h3>
            <div id="t2-candidates-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </div>

        <!-- Comparison Panel -->
        <div id="t2-compare-panel" class="hidden flex flex-col lg:flex-row gap-6">
            <div id="t2-compare-left" class="w-full lg:w-1/2 bg-white shadow-md p-4 sm:p-5 border rounded-lg"></div>
            <div id="t2-compare-right" class="w-full lg:w-1/2 bg-white shadow-md p-4 sm:p-5 border border-green-300 rounded-lg"></div>
        </div>
    </div>

</script>

<script>
    // System Data
    let timetables = {}; 
    let teacherNames = [];
    let excludeF6 = false;
    let highlightF6 = false;

    // Swap State
    let swapState = {
        me: '',
        clickedL: -1,
        clickedD: -1,
        classCode: '',
        candidate: ''
    };

    function initData() {
        const raw = document.getElementById('csv-data').textContent;
        const blocks = raw.split('<start_of_user_uploaded_file:');

        for (let i = 1; i < blocks.length; i++) {
            const block = blocks[i];
            const endIdx = block.indexOf('<end_of_user_uploaded_file:');
            if (endIdx === -1) continue;

            const contentStr = block.substring(0, endIdx);
            const firstCloseBracket = contentStr.indexOf('>');
            if (firstCloseBracket === -1) continue;

            const csvStr = contentStr.substring(firstCloseBracket + 1).trim();
            const lines = csvStr.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length < 9) continue;

            let nameRow = parseCSVRow(lines[0]);
            let name = nameRow[0];
            if(name.startsWith('"') && name.endsWith('"')) {
                name = name.substring(1, name.length-1);
            }

            let grid = [];
            for (let r = 2; r <= 9; r++) { // Lessons 1-8
                if (r < lines.length) {
                    const rowCols = parseCSVRow(lines[r]);
                    grid.push(rowCols.slice(1, 7)); // 6 days
                } else {
                    grid.push(["","","","","",""]);
                }
            }
            timetables[name] = grid;
            teacherNames.push(name);
        }
        teacherNames.sort();
    }

    function parseCSVRow(str) {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for(let i=0; i<str.length; i++) {
            if(str[i] === '"') inQuotes = !inQuotes;
            else if(str[i] === ',' && !inQuotes) { result.push(cur); cur = ''; }
            else cur += str[i];
        }
        result.push(cur);
        return result;
    }

    function isF6(val) {
        if (!val) return false;
        // Matches F6 classes like 6A, 6B, 6A/6B/6C/6D at start of string or after a slash
        return /(^|\/)6[A-D]/.test(val);
    }

    function teachesF6(teacherName) {
        const grid = timetables[teacherName];
        for(let l=0; l<8; l++) {
            for(let d=0; d<6; d++) {
                if(isF6(grid[l][d])) return true;
            }
        }
        return false;
    }

    function isFree(val) {
        if (!val || val.trim().toLowerCase() === 'free') return true;
        if (excludeF6 && isF6(val)) return true;
        return false;
    }

    function toggleHighlightF6() {
        highlightF6 = document.getElementById('highlight-f6').checked;
        updateCommonFree();
    }

    function toggleExcludeF6() {
        excludeF6 = document.getElementById('exclude-f6').checked;

        if (excludeF6 && swapState.clickedL !== -1) {
            const val = timetables[swapState.me][swapState.clickedL][swapState.clickedD];
            if (isF6(val)) {
                swapState.clickedL = -1;
                swapState.clickedD = -1;
                swapState.classCode = '';
                swapState.candidate = '';
                document.getElementById('t2-candidates-panel').classList.add('hidden');
                document.getElementById('t2-compare-panel').classList.add('hidden');
            }
        }

        const tab1 = document.getElementById('tab-1');
        if (!tab1.classList.contains('hidden')) {
            updateCommonFree();
        } else {
            renderMeTable();
            if (swapState.clickedL !== -1) {
                findCandidates();
                if (swapState.candidate) {
                    renderCompare();
                }
            }
        }
    }

    function switchTab(t) {
        const tab1 = document.getElementById('tab-1');
        const tab2 = document.getElementById('tab-2');

        if (t === 1) {
            tab1.classList.remove('hidden');
            tab2.classList.add('hidden');
        } else {
            tab1.classList.add('hidden');
            tab2.classList.remove('hidden');
        }

        const activeBtnClasses = ['bg-blue-600', 'text-white'];
        const inactiveBtnClasses = ['bg-gray-200', 'text-gray-700'];

        const btn1 = document.getElementById('tab-btn-1');
        const btn2 = document.getElementById('tab-btn-2');

        if (t === 1) {
            btn1.classList.remove(...inactiveBtnClasses);
            btn1.classList.add(...activeBtnClasses);
            btn2.classList.remove(...activeBtnClasses);
            btn2.classList.add(...inactiveBtnClasses);
        } else {
            btn2.classList.remove(...inactiveBtnClasses);
            btn2.classList.add(...activeBtnClasses);
            btn1.classList.remove(...activeBtnClasses);
            btn1.classList.add(...inactiveBtnClasses);
        }
    }

    function clearAllTeachers() {
        const checkboxes = document.querySelectorAll('.t1-checkbox');
        checkboxes.forEach(cb => cb.checked = false);
        updateCommonFree();
    }

    // --- Tab 1 Logic ---
    function renderTab1() {
        const listDiv = document.getElementById('t1-teacher-list');
        listDiv.innerHTML = teacherNames.map(n => {
            const star = teachesF6(n) ? '<span class="text-purple-600 ml-1 text-xs font-bold" title="Teaches Form 6">(F6)</span>' : '';
            return `
            <label class="flex items-center space-x-3 p-1.5 hover:bg-white rounded cursor-pointer transition">
                <input type="checkbox" value="${n.replace(/"/g, '&quot;')}" class="t1-checkbox w-4 h-4 text-blue-600 rounded" onchange="updateCommonFree()">
                <span class="text-sm font-medium text-gray-700">${n}${star}</span>
            </label>
            `;
        }).join('');
        updateCommonFree();
    }

    function updateCommonFree() {
        const checkboxes = document.querySelectorAll('.t1-checkbox');
        const selected = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);

        const tbody = document.getElementById('t1-tbody');
        let html = '';
        for (let l=0; l<8; l++) {
            html += `<tr><td class="cell font-bold bg-gray-100 text-gray-700">Lesson ${l+1}</td>`;
            for (let d=0; d<6; d++) {
                let isCommonFree = true;
                let isSingleF6 = false;
                let singleF6Val = "";

                if (selected.length === 0) {
                    isCommonFree = false;
                } else {
                    for (let t of selected) {
                        let val = timetables[t][l][d];
                        if (!isFree(val)) {
                            isCommonFree = false;
                            break;
                        }
                    }

                    // Specific requirement: if ONE teacher is selected and F6 is NOT excluded AND highlight is enabled
                    if (selected.length === 1 && !excludeF6 && highlightF6) {
                        let val = timetables[selected[0]][l][d];
                        if (isF6(val)) {
                            isSingleF6 = true;
                            singleF6Val = val;
                        }
                    }
                }

                let classes = "cell transition";
                let text = "";

                if (isCommonFree) {
                    classes += " cell-highlight";
                    text = "Common Free";
                } else if (isSingleF6) {
                    classes += " bg-purple-100 text-purple-800 font-bold border-purple-200 shadow-inner";
                    text = `<span class="block text-[10px] uppercase tracking-wider mb-0.5 text-purple-600 leading-none">F6 Lesson</span>${singleF6Val}`;
                }

                html += `<td class="${classes}">${text}</td>`;
            }
            html += `</tr>`;
        }
        tbody.innerHTML = html;
    }

    // --- Tab 2 Logic ---
    function initTab2() {
        const sel = document.getElementById('t2-me-select');
        sel.innerHTML = `<option value="">-- Select your name --</option>` + 
                        teacherNames.map(n => `<option value="${n.replace(/"/g, '&quot;')}">${n}</option>`).join('');
    }

    function onMeSelected() {
        swapState.me = document.getElementById('t2-me-select').value;
        swapState.clickedL = -1;
        swapState.clickedD = -1;
        swapState.classCode = '';
        swapState.candidate = '';
        document.getElementById('t2-candidates-panel').classList.add('hidden');
        document.getElementById('t2-compare-panel').classList.add('hidden');
        renderMeTable();
    }

    function renderMeTable() {
        const container = document.getElementById('t2-me-table-container');
        if(!swapState.me) {
            container.innerHTML = '';
            return;
        }
        const grid = timetables[swapState.me];
        let html = `<div class="p-4 bg-gray-50 border-b font-semibold text-gray-700 rounded-t-lg border border-b-0">Your Timetable (Click a lesson you want to swap away)</div>
                    <div class="overflow-x-auto w-full border rounded-b-lg shadow-sm scroller">
                    <table class="w-full border-collapse bg-white min-w-[600px] text-sm table-fixed">
                        <thead class="bg-gray-100 text-gray-600"><tr><th class="cell w-20 sm:w-24"></th>` + 
                   [1,2,3,4,5,6].map(d=>`<th class="cell w-[14.28%]">Day ${d}</th>`).join('') + `</tr></thead><tbody>`;

        for (let l=0; l<8; l++) {
            html += `<tr><td class="cell font-bold bg-gray-50 text-gray-700">Lesson ${l+1}</td>`;
            for (let d=0; d<6; d++) {
                let val = grid[l][d];
                let isF = isFree(val);
                let isClicked = (swapState.clickedL === l && swapState.clickedD === d);

                let displayVal = val;
                if (isF && !(!val || val.trim().toLowerCase() === 'free')) {
                    displayVal = `<span class="line-through text-gray-400 block">${val}</span><span class="text-xs text-green-600 font-bold">Free (F6)</span>`;
                }

                let classes = "cell transition";
                if (isF) classes += " cell-free";
                else classes += " cell-clickable";
                if (isClicked) classes += " cell-swap-give ring-2 ring-yellow-500 shadow-inner";

                let onClickAttr = !isF ? `data-l="${l}" data-d="${d}" data-val="${val.replace(/"/g, '&quot;')}" onclick="onCellClick(this)"` : '';
                html += `<td class="${classes}" ${onClickAttr}>${displayVal}</td>`;
            }
            html += `</tr>`;
        }
        html += `</tbody></table></div>`;
        container.innerHTML = html;
    }

    function onCellClick(el) {
        swapState.clickedL = parseInt(el.dataset.l);
        swapState.clickedD = parseInt(el.dataset.d);
        swapState.classCode = el.dataset.val;
        swapState.candidate = '';

        renderMeTable();
        findCandidates();
        document.getElementById('t2-compare-panel').classList.add('hidden');

        document.getElementById('t2-candidates-panel').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function findCandidates() {
        const {me, clickedL, clickedD, classCode} = swapState;
        const panel = document.getElementById('t2-candidates-panel');
        const listDiv = document.getElementById('t2-candidates-list');
        panel.classList.remove('hidden');

        let cands = [];
        const meGrid = timetables[me];

        for (let tb of teacherNames) {
            if (tb === me) continue;
            let tbGrid = timetables[tb];

            if (!isFree(tbGrid[clickedL][clickedD])) continue;

            let takeBacks = [];
            for (let l2=0; l2<8; l2++) {
                for (let d2=0; d2<6; d2++) {
                    if (tbGrid[l2][d2] === classCode) {
                        if (isFree(meGrid[l2][d2])) {
                            takeBacks.push({l: l2, d: d2});
                        }
                    }
                }
            }

            if (takeBacks.length > 0) {
                cands.push({name: tb, takeBacks});
            }
        }

        if (cands.length === 0) {
            listDiv.innerHTML = `<p class="text-red-500 col-span-full font-medium py-2">No suitable candidates found who teach <span class="font-bold">"${classCode}"</span> and meet the free-lesson requirements.</p>`;
        } else {
            listDiv.innerHTML = cands.map(c => `
                <button data-name="${c.name.replace(/"/g, '&quot;')}" onclick="selectCandidate(this)" class="p-4 border border-blue-200 rounded-lg shadow-sm hover:shadow hover:border-blue-400 bg-white transition flex flex-col text-left focus:outline-none focus:ring-2 focus:ring-blue-300">
                    <span class="font-bold text-blue-800 mb-1">${c.name}</span>
                    <span class="text-xs font-medium text-green-700 bg-green-100 px-2 py-1 rounded-full w-fit">Take-back options: ${c.takeBacks.length}</span>
                </button>
            `).join('');
        }
    }

    function selectCandidate(el) {
        swapState.candidate = el.dataset.name;
        document.getElementById('t2-compare-panel').classList.remove('hidden');
        renderCompare();
        document.getElementById('t2-compare-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderCompare() {
        const meGrid = timetables[swapState.me];
        const tbGrid = timetables[swapState.candidate];
        const classCode = swapState.classCode;

        const meHtml = generateMiniTable(swapState.me, meGrid, (l, d, val) => {
            if (l === swapState.clickedL && d === swapState.clickedD) return 'cell-swap-give ring-2 ring-yellow-500';
            return isFree(val) ? 'cell-free' : '';
        });

        const tbHtml = generateMiniTable(swapState.candidate, tbGrid, (l, d, val) => {
            if (l === swapState.clickedL && d === swapState.clickedD) return 'cell-swap-give border-[3px] border-blue-500 ring-2 ring-yellow-500'; 
            if (val === classCode && isFree(meGrid[l][d])) return 'cell-highlight ring-2 ring-green-400';
            return isFree(val) ? 'cell-free' : '';
        });

        document.getElementById('t2-compare-left').innerHTML = `
            <h3 class="font-bold text-lg mb-1 text-gray-800 border-b pb-2">Your Timetable (${swapState.me})</h3>
            <p class="text-sm mb-3 mt-2 text-yellow-700 font-medium bg-yellow-100 px-3 py-1 rounded w-fit block">Giving away: Day ${swapState.clickedD+1}, Lesson ${swapState.clickedL+1}</p>
            ${meHtml}
        `;
        document.getElementById('t2-compare-right').innerHTML = `
            <h3 class="font-bold text-lg mb-1 text-gray-800 border-b pb-2">Candidate (${swapState.candidate})</h3>
            <p class="text-sm mb-3 mt-2 text-green-800 font-medium bg-green-100 px-3 py-1 rounded w-fit block">Valid take-back lessons are in green.</p>
            ${tbHtml}
        `;
    }

    function generateMiniTable(name, grid, cssCallback) {
        let html = `<div class="overflow-x-auto w-full rounded border scroller"><table class="w-full text-xs border-collapse min-w-[400px] table-fixed"><thead class="bg-gray-100 text-gray-600"><tr><th class="cell w-12 p-1"></th>` + 
                   [1,2,3,4,5,6].map(d=>`<th class="cell p-1 w-[14.6%]">D${d}</th>`).join('') + `</tr></thead><tbody>`;
        for (let l=0; l<8; l++) {
            html += `<tr><td class="cell font-bold bg-gray-50 text-center p-1">L${l+1}</td>`;
            for (let d=0; d<6; d++) {
                let val = grid[l][d];
                let extraCss = cssCallback(l, d, val);

                let displayVal = val;
                if (isFree(val) && !(!val || val.trim().toLowerCase() === 'free')) {
                    displayVal = `<span class="line-through text-gray-400">${val}</span>`;
                }

                html += `<td class="cell p-1 leading-tight ${extraCss}">${displayVal}</td>`;
            }
            html += `</tr>`;
        }
        html += `</tbody></table></div>`;
        return html;
    }

    // Initialize application on load
    window.onload = () => {
        initData();
        renderTab1();
        initTab2();
    };
</script>
